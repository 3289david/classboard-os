<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>중동중학교</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-mark"><svg viewBox="0 0 64 64" aria-hidden="true">
    <path class="frame" d="M10 12h44a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z"/>
    <path class="stand" d="M32 44v8M22 54h20"/>
    <path class="line l1" d="M15 22h18"/><path class="line l2" d="M15 29h12"/><path class="line l3" d="M15 36h22"/>
  </svg></div>
  <div class="boot-title">중동중학교</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-status" id="boot-status">시작하는 중</div>
</div>
<div id="app">
  <header class="top">
    <div class="school"><img id="t-logo" class="logo" alt="" hidden><span class="name" id="t-school"></span><span class="chip accent" id="t-class"></span></div>
    <div class="spacer"></div>
    <div class="status" id="t-status"></div>
    <div class="weather" id="t-weather"></div>
    <div class="clock"><div class="time" id="t-time"></div><div class="date" id="t-date"></div></div>
  </header>

  <main>
    <section class="view" id="v-home">
      <div class="home-left">
        <div class="card now" id="c-now"></div>
        <div class="tt-strip" id="c-tt"></div>
      </div>
      <div class="home-right">
        <div class="card"><h3><span data-ic="megaphone"></span>공지<span class="right" id="n-count"></span></h3><div class="body" id="c-notices"></div></div>
        <div class="card meal"><h3><span data-ic="meal"></span><span id="meal-title">급식</span><span class="right tabs" id="meal-tabs"></span></h3><div class="body" id="c-meal"></div></div>
        <div class="mini-row">
          <button class="mini" id="c-hw"></button>
          <button class="mini" id="c-dday"></button>
          <button class="mini" id="c-att"></button>
        </div>
      </div>
    </section>

    <section class="view" id="v-lesson">
      <div class="lesson-main" id="l-main"></div>
      <div class="lesson-side">
        <div class="timer" id="l-timer"></div>
        <div class="card"><h3><span data-ic="megaphone"></span>공지</h3><div class="body" id="l-notices"></div></div>
      </div>
    </section>

    <section class="view" id="v-break">
      <div class="break-hero" id="b-hero"></div>
      <div class="break-side">
        <div class="card" id="b-weather"></div>
        <div class="card"><h3><span data-ic="megaphone"></span><span id="b-side-title">공지</span></h3><div class="body" id="b-side"></div></div>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <div class="navkeys" id="navkeys"></div>
    <nav class="dock" id="dock"></nav>
    <div class="sys-keys" id="syskeys"></div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel"><div class="ph"><h2 id="p-title"></h2><div class="grow" id="p-tools"></div><button class="close" id="p-close"></button></div><div class="pb" id="p-body"></div></div>
</div>

<div class="emergency" id="emergency"><div class="badge"><span data-ic="alert"></span><span id="em-title">긴급 안내</span></div><div class="txt" id="em-text"></div><div class="meta" id="em-meta"></div><button id="em-ack">확인</button></div>
<div class="class-alert" id="class-alert"></div>
<div class="edge-flash" id="edge-flash"></div>
<div class="toast" id="toast"></div>
<div class="setup" id="setup"><div class="box" id="setup-box"></div></div>
<div class="sleep" id="sleep"></div>

<script src="../shared/icons.js"></script>
<script src="../shared/qr.js"></script>
<script src="../shared/core.js"></script>
<script src="board.js"></script>
</body>
</html>
